name: Bug report
description: Report reproducible engine behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the game, UTC date seed, steps, and a minimal repository if relevant. Do not include secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage mode
      options: [No Redis, Redis configured, Not relevant]
    validations:
      required: true
